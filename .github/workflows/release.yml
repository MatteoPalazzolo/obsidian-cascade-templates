name: Release Obsidian plugin

on:
    push:
        tags:
            - ['[0-9]*']

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write
            attestations: write
        steps:
            - uses: actions/checkout@v6
              with: { fetch-depth: 0 } # necessario per la ancestry

            - name: Tag must be on main
              run: |
                  git fetch --no-tags origin main
                  git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
                    || { echo "Tag $GITHUB_REF_NAME non è su main"; exit 1; }

            - name: Versions must match tag
              run: |
                  tag="${GITHUB_REF#refs/tags/}"
                  test "$tag" = "$(node -p "require('./package.json').version")" \
                    && test "$tag" = "$(node -p "require('./manifest.json').version")" \
                    || { echo "tag/manifest/package non coerenti"; exit 1; }

            - name: Use Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: 'npm'
            
            - name: Build plugin
              run: |
                  npm ci
                  npm run build

            - name: Test code
              run: npm test

            - name: Lint code
              run: npm run lint

            - name: Attest build provenance
              uses: actions/attest@v4
              with:
                  subject-path: |
                      main.js
                      styles.css

            - name: Create release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  tag="${GITHUB_REF#refs/tags/}"

                  gh release create "$tag" \
                    --title="$tag" \
                    --draft \
                    --generate-notes \
                    main.js manifest.json styles.css